services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ip_sakti_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/chroma_db:/app/backend/chroma_db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ip_sakti_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
